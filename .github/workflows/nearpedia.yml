name: NEARpedia

on: pull_request

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: nearpedia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: github-action
      - uses: ./github-action
