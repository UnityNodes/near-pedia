<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="270" viewBox="0 0 1240 270" role="img"><title>How NEAR-pedia works</title><desc>Read NEAR sources live, index them, check code against what NEAR removed, answer with a source and a date.</desc><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/></pattern></defs><rect width="1240" height="270" rx="20" fill="#0A0B0F"/><rect width="1240" height="270" rx="20" fill="url(#g)"/><rect x="0.5" y="0.5" width="1239" height="269" rx="19.5" fill="none" stroke="#2A2F3A"/><rect x="40" y="40" width="266" height="190" rx="14" fill="#12151C" stroke="#2A2F3A"/><rect x="40" y="40" width="266" height="4" rx="2" fill="#D4FF00"/><circle cx="74" cy="82" r="16" fill="#D4FF00" fill-opacity="0.14"/><text x="74" y="88" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#D4FF00" text-anchor="middle">1</text><text x="102" y="89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#F0F2F5" text-anchor="start">Read</text><text x="66" y="132" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">NEAR's own sources, live:</text><text x="66" y="155" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">docs, GitHub, npm and crates,</text><text x="66" y="178" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">RPC, House of Stake, the forum,</text><text x="66" y="201" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">blogs, videos, NEAR Catalog</text><path d="M312 135 h18" stroke="#8B93A1" stroke-width="2"/><path d="M330 129 l8 6 -8 6" fill="none" stroke="#8B93A1" stroke-width="2"/><rect x="338" y="40" width="266" height="190" rx="14" fill="#12151C" stroke="#2A2F3A"/><rect x="338" y="40" width="266" height="4" rx="2" fill="#5CC8FF"/><circle cx="372" cy="82" r="16" fill="#5CC8FF" fill-opacity="0.14"/><text x="372" y="88" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#5CC8FF" text-anchor="middle">2</text><text x="400" y="89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#F0F2F5" text-anchor="start">Index</text><text x="364" y="132" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">Full-text search and 17,867</text><text x="364" y="155" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">meaning chunks; 137 entries</text><text x="364" y="178" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">of what NEAR deprecated;</text><text x="364" y="201" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">a radar whose alerts expire</text><path d="M610 135 h18" stroke="#8B93A1" stroke-width="2"/><path d="M628 129 l8 6 -8 6" fill="none" stroke="#8B93A1" stroke-width="2"/><rect x="636" y="40" width="266" height="190" rx="14" fill="#12151C" stroke="#2A2F3A"/><rect x="636" y="40" width="266" height="4" rx="2" fill="#FFC24B"/><circle cx="670" cy="82" r="16" fill="#FFC24B" fill-opacity="0.14"/><text x="670" y="88" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#FFC24B" text-anchor="middle">3</text><text x="698" y="89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#F0F2F5" text-anchor="start">Check</text><text x="662" y="132" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">check_code reads a file and</text><text x="662" y="155" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">names each line that uses</text><text x="662" y="178" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">something NEAR removed,</text><text x="662" y="201" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">with what replaces it</text><path d="M908 135 h18" stroke="#8B93A1" stroke-width="2"/><path d="M926 129 l8 6 -8 6" fill="none" stroke="#8B93A1" stroke-width="2"/><rect x="934" y="40" width="266" height="190" rx="14" fill="#12151C" stroke="#2A2F3A"/><rect x="934" y="40" width="266" height="4" rx="2" fill="#B69CFF"/><circle cx="968" cy="82" r="16" fill="#B69CFF" fill-opacity="0.14"/><text x="968" y="88" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#B69CFF" text-anchor="middle">4</text><text x="996" y="89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#F0F2F5" text-anchor="start">Answer</text><text x="960" y="132" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">27 MCP tools, a REST API,</text><text x="960" y="155" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">a site and /ask on NEAR AI,</text><text x="960" y="178" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">each answer with its source</text><text x="960" y="201" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B93A1" text-anchor="start">and its date</text></svg>